# Says which of the setup secrets are present (set / missing) - never their values.
name: secrets-check
on:
  push:
    paths: [".github/workflows/secrets-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets are set
        env:
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C: ${{ secrets.DISCORD_APP_ID }}
          D: ${{ secrets.DISCORD_PUBLIC_KEY }}
          E: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          for p in "CLOUDFLARE_ACCOUNT_ID:$A" "CLOUDFLARE_API_TOKEN:$B" "DISCORD_APP_ID:$C" "DISCORD_PUBLIC_KEY:$D" "DISCORD_BOT_TOKEN:$E"; do
            n="${p%%:*}"; v="${p#*:}"; if [ -n "$v" ]; then echo "SECRET $n = set"; else echo "SECRET $n = missing"; fi
          done
