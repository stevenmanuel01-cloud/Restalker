# Says which of the setup secrets are present (set / missing) - never their values.
name: secrets-check
on:
  push:
    paths: [".github/workflows/secrets-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets are set
        env:
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          C: ${{ secrets.DISCORD_APP_ID }}
          D: ${{ secrets.DISCORD_PUBLIC_KEY }}
          E: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          for p in "CLOUDFLARE_ACCOUNT_ID:$A" "CLOUDFLARE_API_TOKEN:$B" "DISCORD_APP_ID:$C" "DISCORD_PUBLIC_KEY:$D" "DISCORD_BOT_TOKEN:$E"; do
            n="${p%%:*}"; v="${p#*:}"; if [ -n "$v" ]; then echo "SECRET $n = set"; else echo "SECRET $n = missing"; fi
          done
      - name: Do the Cloudflare ones work (yes / no only)
        env:
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          B: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -z "$A" ] || [ -z "$B" ] && { echo "CF not both set"; exit 0; }
          v=$(curl -s -H "Authorization: Bearer $B" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success'), (d.get('result') or {}).get('status'))")
          echo "CF token valid: $v"
          w=$(curl -s -H "Authorization: Bearer $B" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success'), [e.get('code') for e in d.get('errors',[])])")
          echo "CF account + workers access: $w"
          s=$(curl -s -H "Authorization: Bearer $B" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result') or {}; print(d.get('success'), 'subdomain set' if r.get('subdomain') else 'no subdomain yet')")
          echo "CF workers.dev subdomain: $s"
