# Prints the live relay's stats and its recent log (nothing secret) - Claude reads it (the relay's address is not reachable from Claude's workspace).
name: relay-check
on:
  push:
    paths: [".github/workflows/relay-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 20 "https://restalker-relay.restalker.workers.dev/v1/stats?log" | python3 -m json.tool
          curl -s -m 20 "https://restalker-relay.restalker.workers.dev/v1/feed?since=0" | python3 -c "import sys,json; d=json.load(sys.stdin); print('feed events:', len(d['events'])); [print(e) for e in d['events'][-10:]]"
# run 1
