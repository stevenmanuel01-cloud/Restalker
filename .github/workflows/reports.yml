name: Reports to the owner
# Asks the relay for the reports people sent and hands its answer on. The request is signed by the owner's side (inputs t and s: a
# signature that counts for 10 minutes and for this one request only); the relay's answer is SEALED with the owner's public key and
# carries no device codes - only the holder of the private key can read it. Nothing of a report is ever readable or printed here.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "reports newer than this (milliseconds)"
        required: true
      t:
        description: "when the request was signed (milliseconds)"
        required: true
      s:
        description: "the owner's signature"
        required: true
      clear:
        description: "1 = only remove the branch owner-reports (after the owner's side has read it)"
        default: ""
permissions:
  contents: write          # (only to put the SEALED answer on the branch "owner-reports", where the owner's side fetches it)
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SINCE: ${{ github.event.inputs.since }}
      T: ${{ github.event.inputs.t }}
      S: ${{ github.event.inputs.s }}
    steps:
      - name: Remove the handed-on answer
        if: ${{ github.event.inputs.clear == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q x && cd x
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete owner-reports || echo "it was not there"
      - name: Ask the relay
        if: ${{ github.event.inputs.clear != '1' }}
        run: |
          umask 077; mkdir -p out
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          A, T = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip(), os.environ["CLOUDFLARE_API_TOKEN"].strip()
          req = urllib.request.Request(f"https://api.cloudflare.com/client/v4/accounts/{A}/workers/subdomain", headers={"Authorization": "Bearer " + T})
          sub = json.load(urllib.request.urlopen(req, timeout=30))["result"]["subdomain"]
          since, t, s = os.environ["SINCE"].strip(), os.environ["T"].strip(), os.environ["S"].strip()
          if not (re.fullmatch(r"\d{1,16}", since) and re.fullmatch(r"\d{1,16}", t) and re.fullmatch(r"[A-Za-z0-9_-]{100,800}", s)):
              print("NOT READ - the inputs are not a signed request"); open("out/not_read.txt", "w").write("inputs"); raise SystemExit(0)
          r = urllib.request.Request(f"https://restalker-relay.{sub}.workers.dev/v1/owner/reports?since={since}&t={t}&s={s}", headers={"User-Agent": "restalker-owner"})
          try:
              body = urllib.request.urlopen(r, timeout=60).read()
          except urllib.error.HTTPError as e:
              # (the run ends as finished, not failed: GitHub e-mails the owner for every failed run)
              print("NOT READ - the relay refused:", e.code); open("out/not_read.txt", "w").write(str(e.code)); raise SystemExit(0)
          d = json.loads(body)
          open("out/reports.sealed.json", "wb").write(body)
          print("reports handed on (sealed):", d.get("n"))
          PY
      - name: Hand the sealed answer on (branch owner-reports, replaced each time - no history is kept)
        if: ${{ github.event.inputs.clear != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q && git checkout -q -b owner-reports && git add -A
          git -c user.name="restalker" -c user.email="restalker@users.noreply.github.com" commit -q -m "sealed reports (only the owner's key opens them)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" owner-reports
