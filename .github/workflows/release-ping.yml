# Tells every Restalker that a new version is out, the moment it is published here (v118). Restalker listens on this ntfy channel and
# then checks latest.json itself (the download is still verified by its sha256 - this message can only make it look sooner, never
# install anything). Runs only when latest.json changes on main.
name: release-ping
on:
  push:
    branches: [main]
    paths: [latest.json]
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Announce the new version on the release channel
        env:
          TOPIC: restalker-releases-93590d22731021d1
        run: |
          V=$(python3 -c "import json;print(json.load(open('latest.json'))['version'])")
          echo "version $V"
          # v130: ntfy can refuse GitHub's shared address for a while ("429 too many") - the v129 ping was lost that way. So: up to 12
          # tries over about 10 minutes, each one read back from the channel. Never fails the job (no GitHub e-mails); the PC also
          # takes a fresh look every 6 hours by itself.
          ok=""
          for i in $(seq 1 12); do
            curl -sS -m 20 -o /dev/null -w "try $i: answer %{http_code}\n" -H "Title: Restalker $V" -d "$V" "https://ntfy.sh/$TOPIC" || true
            sleep 3
            if curl -sS -m 20 "https://ntfy.sh/$TOPIC/json?poll=1&since=15m" | grep -q "\"message\":\"$V\""; then ok=1; break; fi
            sleep $((10 + i * 5))
          done
          if [ -n "$ok" ]; then echo "PING ON THE CHANNEL: $V"; else echo "PING NOT DELIVERED (429?) - the PC finds $V by its 6-hour safety look"; fi
