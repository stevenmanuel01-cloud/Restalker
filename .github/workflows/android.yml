# Restalker Mobile: build, the core rule tests, then the app on a virtual Android phone against the stand-in Amazon.
name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Signing key (when the repository has one)
        env:
          KS: ${{ secrets.RKM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/rk.jks; echo "RKM_KEYSTORE=$RUNNER_TEMP/rk.jks" >> $GITHUB_ENV; fi
      - name: Core rule tests + build
        working-directory: android
        env:
          RKM_KEYSTORE_PASSWORD: ${{ secrets.RKM_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Core test report
        if: always()
        run: |
          f=$(ls android/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -1); [ -n "$f" ] && grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || echo "no unit test report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/tests/
          if-no-files-found: warn

  phone:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [34, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Enable KVM (fast virtual phone)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g apk/outputs/apk/debug/app-debug.apk || adb install -r -g $(ls apk/**/app-debug.apk | head -1)
            adb install -r -g apk/outputs/apk/androidTest/debug/app-debug-androidTest.apk || adb install -r -g $(ls apk/**/app-debug-androidTest.apk | head -1)
            adb shell am instrument -w -r -e debug false com.restalker.mobile.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            adb logcat -d > logcat.txt || true
            bash android/ci/evidence.sh || true
            grep -q "FAILURES!!!\|INSTRUMENTATION_FAILED\|Process crashed" instrument.txt && exit 1 || grep -q "^OK (" instrument.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-api${{ matrix.api }}
          path: |
            instrument.txt
            shots/
            logcat.txt

  # A tested, signed APK becomes a GitHub release (once per version). Only with the app's own signing key (repository secret):
  # every version must carry the same key, or a phone refuses the update.
  publish:
    needs: [build, phone]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Release the APK
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.RKM_KEYSTORE_B64 != '' }}
        run: |
          VER=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          if [ "$HAS_KEY" != "true" ]; then echo "No signing key in the repository secrets yet - not released."; exit 0; fi
          if gh release view "mobile-v$VER" >/dev/null 2>&1; then echo "mobile-v$VER is already released."; exit 0; fi
          APK=$(ls apk/outputs/apk/release/*.apk | head -1)
          cp "$APK" "restalker-mobile-$VER.apk"
          sha256sum "restalker-mobile-$VER.apk"
          gh release create "mobile-v$VER" "restalker-mobile-$VER.apk" --title "Restalker Mobile $VER" --notes-file android/RELEASE_NOTES.md
