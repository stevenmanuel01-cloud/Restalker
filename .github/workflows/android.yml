# Restalker Mobile: build, the core rule tests, then the app on a virtual Android phone against the stand-in Amazon.
name: android
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # (v127, owner: "im getting email alerts which is not desired": GitHub e-mails the owner for every FAILED run. A failed build or
  #  test now ends the run as finished, not failed - the results are read from the run itself; nothing is released unless every phone passed)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      ok: ${{ steps.b.outcome == 'success' }}
      scope: ${{ steps.sc.outputs.scope }}
      phones: ${{ steps.sc.outputs.phones }}
      tested: ${{ steps.sc.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # 1.0.3 (owner, 2026-11-20: "when we are making a simple aesthetic change ... changing the color of something shouldnt require full
      # operation and checkout testing as this was previously passed and not affected by a color change"): the phone tests this change
      # needs (android/ci/scope.py: look / screens / full) - and on main, nothing again when the very same files already passed on every
      # phone on their branch (the merge of a tested branch is the same program).
      - name: Which tests this change needs
        id: sc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then base=$(git rev-parse HEAD^1); else base=$(git merge-base origin/main HEAD); fi
          out=$(python3 android/ci/scope.py "$base" "$(git log -1 --format=%B)")
          sc=$(echo "$out" | sed -n 1p); ph=$(echo "$out" | sed -n 2p); tested=""
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # (the app's own files: android/ and this workflow - a release of the PC on main meanwhile does not count)
            key() { echo "$(git rev-parse "$1:android" 2>/dev/null)$(git rev-parse "$1:.github/workflows/android.yml" 2>/dev/null)"; }
            tree=$(key HEAD); need=$(echo "$ph" | tr -d '[] ' | tr ',' ' ')
            for r in $(gh api "repos/${{ github.repository }}/actions/workflows/android.yml/runs?status=completed&per_page=30" -q '.workflow_runs[]|select(.head_branch!="main")|"\(.id):\(.head_sha)"' 2>/dev/null); do
              rid=${r%%:*}; sha=${r#*:}
              [ "$(key "$sha")" = "$tree" ] || continue
              gh run download "$rid" -p 'phone-*api*' -D "prev/$rid" >/dev/null 2>&1 || continue
              okc=0; for a in $need; do [ "$(cat prev/$rid/phone-api$a/result.txt 2>/dev/null)" = "success" ] && okc=$((okc+1)); done
              # (1.0.7: and the Google Play edition passed on its phone)
              if [ "$okc" -eq "$(echo $need | wc -w)" ] && [ "$(cat prev/$rid/phone-play-api36/result.txt 2>/dev/null)" = "success" ]; then tested=$rid; break; fi
            done
          fi
          { echo "scope=$sc"; echo "phones=$ph"; echo "tested=$tested"; } >> $GITHUB_OUTPUT
          echo "TESTS FOR THIS CHANGE: $sc - phones $ph"
          [ -n "$tested" ] && echo "THE SAME FILES ALREADY PASSED ON EVERY PHONE (run $tested) - not tested again" || true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Signing key (when the repository has one)
        env:
          KS: ${{ secrets.RKM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/rk.jks; echo "RKM_KEYSTORE=$RUNNER_TEMP/rk.jks" >> $GITHUB_ENV; fi
      - name: Core rule tests + build
        id: b
        continue-on-error: true
        working-directory: android
        env:
          RKM_KEYSTORE_PASSWORD: ${{ secrets.RKM_KEYSTORE_PASSWORD }}
        run: |
          # two "newer" copies of the test app first (version code +1 and +2): the virtual phone checks that the app updates itself
          mkdir -p app/build/next
          for b in 1 2; do gradle --no-daemon -q :app:assembleDebug -PrkCodeBump=$b && cp app/build/outputs/apk/debug/app-debug.apk app/build/next/next$b.apk; done
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
          # 1.0.7: the Google Play edition - the bundle that is uploaded to the store, an APK of it to look into, and its test build
          gradle --no-daemon -PrkEdition=play :app:bundlePlay :app:assemblePlay :app:assemblePlayDebug :app:assemblePlayDebugAndroidTest
          # ... and what each edition is, read from the built files themselves: the Play edition holds none of the three permissions
          # (installing its own updates, asking to be let off battery saving) and no installer code; the GitHub edition still has
          # them; both are made for Android 16 (Google Play takes nothing older since 2026-08-31)
          A=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1); bad=0
          PLAY=app/build/outputs/apk/play/app-play.apk; GH=app/build/outputs/apk/release/app-release.apk; AAB=app/build/outputs/bundle/play/app-play.aab
          ls -la $PLAY $GH $AAB || bad=1
          pp=$($A dump permissions $PLAY); gp=$($A dump permissions $GH)
          for p in REQUEST_INSTALL_PACKAGES UPDATE_PACKAGES_WITHOUT_USER_ACTION REQUEST_IGNORE_BATTERY_OPTIMIZATIONS; do
            if echo "$pp" | grep -q "$p"; then echo "THE GOOGLE PLAY EDITION HOLDS $p"; bad=1; fi
            if ! echo "$gp" | grep -q "$p"; then echo "THE GITHUB EDITION LOST $p"; bad=1; fi
          done
          echo "Google Play edition permissions:"; echo "$pp" | grep "uses-permission" | sed 's/.*name=//' | tr '\n' ' '; echo
          for f in $PLAY $GH; do t=$($A dump badging $f | grep -o "targetSdkVersion:'[0-9]*'"); echo "$f $t"; [ "$t" = "targetSdkVersion:'36'" ] || { echo "NOT MADE FOR ANDROID 16: $f"; bad=1; }; done
          if unzip -p $PLAY 'classes*.dex' | grep -aq 'Landroid/content/pm/PackageInstaller\$Session;'; then echo "THE GOOGLE PLAY EDITION CARRIES INSTALLER CODE"; bad=1; else echo "Google Play edition: no installer code"; fi
          unzip -p $GH 'classes*.dex' | grep -aq 'Landroid/content/pm/PackageInstaller\$Session;' || { echo "THE GITHUB EDITION LOST ITS UPDATER"; bad=1; }
          unzip -l $AAB | grep -q "base/manifest/AndroidManifest.xml" || { echo "THE BUNDLE IS NOT A BUNDLE"; bad=1; }
          # (Google Play, for apps made for Android 15 and later: every built-in library must work with 16 KB memory pages)
          rm -rf /tmp/so && mkdir -p /tmp/so && unzip -o -q $PLAY 'lib/*' -d /tmp/so || true
          for so in $(find /tmp/so -name '*.so'); do
            al=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' '); echo "${so#/tmp/so/} $al"
            for x in $al; do [ $((x)) -ge 16384 ] || { echo "NOT READY FOR 16 KB PAGES: $so"; bad=1; }; done
          done
          Z=$(ls $ANDROID_HOME/build-tools/*/zipalign | sort -V | tail -1)
          $Z -c -P 16 4 $PLAY && echo "16 KB pages: OK" || { echo "THE GOOGLE PLAY EDITION IS NOT ALIGNED FOR 16 KB PAGES"; bad=1; }
          [ $bad -eq 0 ] && echo "EDITIONS: OK" || exit 1
      - name: Central list pictures load (2.8)
        if: always()
        run: |
          # every picture of mobile/catalog.json is fetched as a phone would: it must be a real picture (JPEG/PNG/WebP, not a page or a dot)
          python3 - <<'EOF'
          import json, urllib.request
          d = json.load(open("mobile/catalog.json")); ok = bad = none = 0
          for p in d["products"]:
              u = p.get("i")
              if not u: none += 1; print("no picture in the list:", p["a"], p["n"][:50]); continue
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "RestalkerMobile", "Accept": "image/*"}), timeout=20)
                  b = r.read(3_000_000); kind = "jpeg" if b[:3] == b"\xff\xd8\xff" else "png" if b[:4] == b"\x89PNG" else "webp" if b[8:12] == b"WEBP" else ""
                  if r.status == 200 and kind and len(b) > 1500: ok += 1
                  else: bad += 1; print("PICTURE NOT OK:", p["a"], p["n"][:50], r.status, len(b), kind or b[:20])
              except Exception as e:
                  bad += 1; print("PICTURE NOT OK:", p["a"], p["n"][:50], str(e)[:80])
          print(f"central list pictures: {ok} load, {bad} do not, {none} have none")
          EOF
      - name: Core test report
        if: always()
        run: |
          f=$(ls android/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -1); [ -n "$f" ] && grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" || echo "no unit test report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/outputs/apk/play/*.apk
            android/app/build/outputs/apk/playDebug/*.apk
            android/app/build/outputs/apk/androidTest/playDebug/*.apk
            android/app/build/outputs/bundle/play/*.aab
            android/app/build/next/*.apk
            android/app/build/reports/tests/
          if-no-files-found: warn

  phone:
    needs: build
    if: needs.build.outputs.ok == 'true' && needs.build.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.build.outputs.phones || '[30, 33, 34, 35, 36]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Enable KVM (fast virtual phone)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on a virtual phone
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: RK_SCOPE=${{ needs.build.outputs.scope }} bash android/ci/phone.sh
      - name: Result
        if: always()
        run: |
          echo "${{ steps.run.outcome }}" > result.txt
          echo "RESULT api${{ matrix.api }} = $(cat result.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-api${{ matrix.api }}
          path: |
            result.txt
            instrument*.txt
            monkey.txt
            shots/
            logcat.txt

  # 1.0.7: the Google Play edition on the Android it is made for (the same tests, without the self-update; it also records the short
  # film the store asks for). Its result is needed before the bundle is handed over.
  phone-play:
    needs: build
    if: needs.build.outputs.ok == 'true' && needs.build.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - name: Enable KVM (fast virtual phone)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the Google Play edition on a virtual phone
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: RK_EDITION=play RK_SCOPE=full bash android/ci/phone.sh
      - name: Result
        if: always()
        run: |
          echo "${{ steps.run.outcome }}" > result.txt
          echo "RESULT play api36 = $(cat result.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-play-api36
          path: |
            result.txt
            instrument*.txt
            monkey.txt
            shots/
            store/
            logcat.txt

  # A tested, signed APK becomes a GitHub release (once per version). Only with the app's own signing key (repository secret):
  # every version must carry the same key, or a phone refuses the update.
  publish:
    needs: [build, phone, phone-play]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: apk }
      - uses: actions/download-artifact@v4
        if: needs.build.outputs.tested == ''
        with: { pattern: "phone-*api*", path: results }
      - uses: actions/download-artifact@v4          # (the same files passed on their branch: those results)
        if: needs.build.outputs.tested != ''
        with: { pattern: "phone-*api*", path: results, run-id: "${{ needs.build.outputs.tested }}", github-token: "${{ github.token }}" }
      - name: Every phone passed?
        id: all
        run: |
          need=$(echo '${{ needs.build.outputs.phones }}' | tr -d '[] ' | tr ',' ' '); [ -n "$need" ] || need="30 33 34 35 36"
          n=0; t=0; for a in $need; do t=$((t+1)); r=$(cat results/phone-api$a/result.txt 2>/dev/null); echo "api$a: ${r:-no result}"; [ "$r" = "success" ] && n=$((n+1)); done
          echo "tests: ${{ needs.build.outputs.scope }}${{ needs.build.outputs.tested != '' && format(' (passed on the branch, run {0})', needs.build.outputs.tested) || '' }}"
          if [ $n -eq $t ]; then echo "ok=true" >> $GITHUB_OUTPUT; echo "ALL PHONES PASSED"; else echo "ok=false" >> $GITHUB_OUTPUT; echo "NOT RELEASED: $((t-n)) phone(s) did not pass"; fi
      - name: Release the APK
        if: steps.all.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.RKM_KEYSTORE_B64 != '' }}
        run: |
          VER=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          if [ "$HAS_KEY" != "true" ]; then echo "No signing key in the repository secrets yet - not released."; exit 0; fi
          if gh release view "mobile-v$VER" >/dev/null 2>&1; then echo "mobile-v$VER is already released."; exit 0; fi
          APK=$(ls apk/outputs/apk/release/*.apk | head -1)
          cp "$APK" "restalker-mobile-$VER.apk"
          sha256sum "restalker-mobile-$VER.apk"
          # 1.0 (owner: "all other versions should be standard"): a new version is the owner's beta first - a PRE-release here, so the
          # download page for everyone (.../releases/latest: the README and the app's share QR) keeps giving the version everyone has.
          # "Release to everyone" (promote.yml) makes it the latest one.
          # 1.0.1 (owner: "way too many release notes so it's nearly impossible to find the actual download"): the page starts with
          # the download link and the install steps, then only this version's notes (android/ci/release_body.py)
          python3 android/ci/release_body.py "$VER" > release_body.md || cp android/RELEASE_NOTES.md release_body.md
          gh release create "mobile-v$VER" "restalker-mobile-$VER.apk" --title "Restalker Mobile $VER" --notes-file release_body.md --prerelease
      # 1.0.7: what goes to Google Play - the app bundle of the Play edition (only when it passed on its own phone), its screenshots
      # and the short film for the background-watching declaration. Kept on one page of its own ("play-kit"), not on the app's
      # download page. The bundle is signed with the app's key (Google Play's "upload key").
      - name: The Google Play upload kit
        if: steps.all.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.RKM_KEYSTORE_B64 != '' }}
        run: |
          VER=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d'"' -f2)
          if [ "$HAS_KEY" != "true" ]; then echo "No signing key - no bundle."; exit 0; fi
          if [ "$(cat results/phone-play-api36/result.txt 2>/dev/null)" != "success" ]; then echo "THE GOOGLE PLAY EDITION DID NOT PASS ON ITS PHONE - no bundle handed over"; exit 0; fi
          cp apk/outputs/bundle/play/app-play.aab "restalker-play-$VER.aab"; sha256sum "restalker-play-$VER.aab"
          files="restalker-play-$VER.aab"
          mkdir -p kit; cp results/phone-play-api36/shots/*.png kit/ 2>/dev/null || true
          (cd kit && rm -f *.small.png fail_* && ls | head -80 && zip -q ../play-screenshots.zip *.png) && files="$files play-screenshots.zip" || echo "no screenshots"
          # (the store page's icon, banner and five pictures, kept in the repository: store/play)
          if ls store/play/*.png >/dev/null 2>&1; then zip -q -j restalker-store-graphics.zip store/play/*.png && files="$files restalker-store-graphics.zip"; fi
          v=results/phone-play-api36/store/restalker-background-watching.mp4
          if [ -s "$v" ]; then cp "$v" .; files="$files restalker-background-watching.mp4"; else echo "no store film"; fi
          gh release view play-kit >/dev/null 2>&1 || gh release create play-kit --prerelease --title "Google Play upload kit" \
            --notes "Files for the Google Play listing: the app bundle to upload there, screenshots, and the short film for the background-watching declaration. Not for installing on a phone - the app itself is on the newest release."
          gh release upload play-kit $files --clobber
          echo "PLAY KIT: $files"
